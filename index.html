<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My To Do List</h1>
        <p>This website is an interactive to-do list that helps users manage tasks, 
            choose what to work on, and complete a timed focus session.</p>
    </header>
    <main>
        <section class = "addTaskSection">
            <h2>Add a Task</h2>
            <form id = "taskForm">
                <label for="taskName">Task Name</label>
                <input type="text" id = "taskName" name="taskName">
                <label for="importance">Importance</label>
                <select name="importance" id="importance">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
                <input type="submit" id = "addTask" name="addTask" value="Add Task">
                <p id = "errorMessage"></p>
            </form>
        </section>

        <section class = "taskSection">
            <h2>My Tasks</h2>
            <ul id = "taskList">

            </ul>
        </section>

        <section class = "timerSection">
            <h2>Focus Timer</h2>
            <p>Doing Now <span id = "doingNowTask">None</span></p>
            
            <label for="duration">Duration</label>
                <select name="duration" id="duration">
                    <option value="10">10 minutes</option>
                    <option value="20">20 minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="40">40 minutes</option>
                    <option value="50">50 minutes</option>
                    <option value="60">60 minutes</option>
                    <option value="70">70 minutes</option>
                    <option value="80">80 minutes</option>
                    <option value="90">90 minutes</option>
                    <option value="100">100 minutes</option>
                    <option value="110">110 minutes</option>
                    <option value="120">120 minutes</option>
                </select>
            <p>Time Remaining</p>
            <p id = "timerDisplay">10:00</p>
            <button type="button" id = "startTimer" disabled>Start</button>
            <button type="button" id="resetTimer">Reset Timer</button>
            
        </section>
    </main>
    

    <script src="script.js"></script>
</body>
</html>
